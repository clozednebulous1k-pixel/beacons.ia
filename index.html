<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duda Freitas 🌸</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f1e4f3; /* Fundo lilás claro suave característico do Beacons */
      position: relative;
      overflow-x: hidden;
      padding: 20px 12px 60px;
    }

    /* Efeito de fundo desfocado similar à visualização desktop */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 30%, rgba(220, 180, 215, 0.45) 0%, transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(235, 175, 185, 0.45) 0%, transparent 60%),
                  #f3e8f5;
      z-index: -1;
    }

    /* Container central formato mobile / bio link */
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
    }

    /* Card da foto de perfil / destaque */
    .hero-card {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin-bottom: 12px;
      aspect-ratio: 4 / 4.8;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hero-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.4s ease;
    }

    .hero-card:hover .hero-image {
      transform: scale(1.02);
    }

    /* Overlay escuro/gradiente suave na base da foto para contraste do texto */
    .hero-overlay {
      position: relative;
      z-index: 2;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.75) 45%, rgba(255, 255, 255, 0) 100%);
      padding: 40px 16px 14px;
      text-align: center;
      width: 100%;
    }

    .profile-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #3b1130;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.2px;
    }

    .profile-subtitle {
      font-size: 0.72rem;
      font-weight: 600;
      color: #4a2845;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 6px;
      line-height: 1.35;
      padding: 0 10px;
    }

    /* Lista de botões */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    /* Estilo do botão idêntico ao modelo (borda preta fina, cantos arredondados, fundo branco) */
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #2d262d;
      border-radius: 14px;
      padding: 10px 16px;
      text-decoration: none;
      color: #1a1a1a;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .link-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      background-color: #faf5fa;
    }

    .link-item:active {
      transform: scale(0.99);
    }

    /* Miniatura da esquerda */
    .thumb-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #f0e6f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-logo {
      width: 85%;
      height: auto;
      object-fit: contain;
    }

    /* Conteúdo central do texto */
    .link-content {
      flex: 1;
      text-align: center;
      padding: 0 10px;
    }

    .link-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #241d24;
      line-height: 1.25;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .link-subtitle {
      font-size: 0.72rem;
      color: #665b66;
      font-weight: 400;
      margin-top: 2px;
    }

    /* Ícone de 3 pontos à direita */
    .more-options {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7d6b7b;
      cursor: pointer;
      width: 20px;
      flex-shrink: 0;
    }

    /* Rodapé Beacons */
    .footer-badge {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4a3e4a;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(4px);
    }

    .footer-badge svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <main class="container">

            <circle cx="12" cy="12" r="1"></circle>

        <div class="more-options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>

    </section>

    <!-- Rodapé estilo Beacons -->

  </main>

</body>
</html>
